# SwiftLint Configuration for Elfy Project

# Logging allow-list groundwork (architecture-hardening T3, sad.md §11 risk row 1):
# these two persistence-layer print sites don't fit any allow-list category from
# sad.md §8 (not a logger implementation, not a leaf/dev-only/diagnostics module) —
# extending the allow-list to cover them is the T3 decision. The custom_rules entry
# itself (ADR-0004) is wired in T5; these paths are recorded here for it to consume:
#   - Packages/elf_Kit/Sources/DataLayer/Persistence/Implementation/FileGameSaveStorage.swift
#   - Packages/elf_Kit/Sources/DataLayer/Persistence/Model/DungeonRunRewardsSaveData.swift

# Excluded paths from linting
excluded:
  - "**/.build"              # SPM build folders in all packages
  - "**/DerivedData"         # Xcode build artifacts
  - Packages/elf_Kit/Tests   # Unit tests - remove if you want to lint tests
  - Design                   # Design assets folder

# Disabled rules (too strict or SwiftUI-incompatible)
disabled_rules:
  - trailing_comma                          # Trailing comma after last element - personal preference
  - opening_brace                           # Sometimes conflicts with formatting
  - identifier_name                         # Too strict for short names (i, x, id)
  - multiple_closures_with_trailing_closure # Common pattern in SwiftUI
  - vertical_whitespace_closing_braces      # Too noisy, low value
  - redundant_discardable_let               # Needed for `let _ = Self._printChanges()` in @ViewBuilder

# Opt-in rules (useful but disabled by default)
opt_in_rules:
  - empty_count              # Prefer .isEmpty over .count == 0
  - empty_string             # Prefer .isEmpty over == ""
  - force_unwrapping         # Warn about force unwrap (!)
  - sorted_imports           # Keep imports alphabetically sorted

# Raw `print(` guard (architecture-hardening T5, ADR-0004, sad.md §8): ViewModels/services
# must log through @Dependency(\.debugGameLogger) / \.debugBattleLogger instead of raw print.
# The allow-list below is sad.md §8 plus T3's two persistence-layer additions (see header comment).
custom_rules:
  raw_print_banned:
    name: "Raw print( banned"
    regex: "(?<!Self\\.|Swift\\.)\\bprint\\("
    match_kinds:
      - identifier
    message: "Don't call print( directly — route logging through the injected logger dependency (@Dependency(\\.debugGameLogger) or \\.debugBattleLogger) instead."
    severity: error
    included:
      - ".*\\.swift"
    excluded:
      - ".*/Services/Logging/Implementation/.*Logger.*\\.swift"
      - "Packages/elf_SwiftUI/.*"
      - "Packages/elf_iOS/Sources/Screens/Dev/.*"
      - "Packages/elf_Kit/Sources/UILayer/Dev/.*"
      - "Packages/elf_iOS/Sources/Diagnostics/.*"
      - "elf/ElfApp\\.swift"
      - "Packages/elf_Kit/Sources/DataLayer/Persistence/Implementation/FileGameSaveStorage\\.swift"
      - "Packages/elf_Kit/Sources/DataLayer/Persistence/Model/DungeonRunRewardsSaveData\\.swift"

# Line length - very relaxed
line_length:
  warning: 400
  error: 1000
  ignores_comments: true
  ignores_urls: true

# File length limits
file_length:
  warning: 500
  error: 600

# Type body length limits
type_body_length:
  warning: 350
  error: 450

# Function body length limits - relaxed for complex game logic
function_body_length:
  warning: 100
  error: 200

# Function parameter count - SwiftUI Views and game logic often have many parameters
function_parameter_count:
  warning: 10
  error: 12

# Large tuple - allow slightly larger tuples
large_tuple:
  warning: 4
  error: 5

# Cyclomatic complexity - relaxed for complex business logic
cyclomatic_complexity:
  warning: 15
  error: 20

# Type name length - SwiftUI Views can have descriptive names
type_name:
  min_length: 2
  max_length: 50
