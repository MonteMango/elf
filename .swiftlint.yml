# SwiftLint Configuration for Elfy Project

# Excluded paths from linting
excluded:
  - "**/.build"              # SPM build folders in all packages
  - "**/DerivedData"         # Xcode build artifacts
  - Packages/elf_Kit/Tests   # Unit tests - remove if you want to lint tests
  - Design                   # Design assets folder

# Disabled rules (too strict or SwiftUI-incompatible)
disabled_rules:
  - trailing_comma                          # Trailing comma after last element - personal preference
  - opening_brace                           # Sometimes conflicts with formatting
  - identifier_name                         # Too strict for short names (i, x, id)
  - multiple_closures_with_trailing_closure # Common pattern in SwiftUI
  - vertical_whitespace_closing_braces      # Too noisy, low value
  - redundant_discardable_let               # Needed for `let _ = Self._printChanges()` in @ViewBuilder

# Opt-in rules (useful but disabled by default)
opt_in_rules:
  - empty_count              # Prefer .isEmpty over .count == 0
  - empty_string             # Prefer .isEmpty over == ""
  - force_unwrapping         # Warn about force unwrap (!)
  - sorted_imports           # Keep imports alphabetically sorted

# Line length - very relaxed
line_length:
  warning: 400
  error: 1000
  ignores_comments: true
  ignores_urls: true

# File length limits
file_length:
  warning: 500
  error: 600

# Type body length limits
type_body_length:
  warning: 350
  error: 450

# Function body length limits - relaxed for complex game logic
function_body_length:
  warning: 100
  error: 200

# Function parameter count - SwiftUI Views and game logic often have many parameters
function_parameter_count:
  warning: 10
  error: 12

# Large tuple - allow slightly larger tuples
large_tuple:
  warning: 4
  error: 5

# Cyclomatic complexity - relaxed for complex business logic
cyclomatic_complexity:
  warning: 15
  error: 20

# Type name length - SwiftUI Views can have descriptive names
type_name:
  min_length: 2
  max_length: 50
